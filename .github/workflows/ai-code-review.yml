# AI Code Reviewer - DeepSeek V3
# Revisão automatizada de PRs alinhada ao Manifesto Curupira

name: "🧜‍♀️ Iara - Revisora de Código"

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: "Executar revisão"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para obter histórico completo do diff
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Obter diff do PR
        id: diff
        run: |
          # Obtém o diff entre a branch base e a branch do PR
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "diff_size=$(wc -c < pr_diff.txt)" >> $GITHUB_OUTPUT
      
      - name: Executar revisão IA
        if: steps.diff.outputs.diff_size != '0'
        id: review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_DIFF: ${{ '' }}
        run: |
          # Lê o diff e envia para o script de revisão
          export PR_DIFF=$(cat pr_diff.txt)
          python .github/scripts/ai-review.py > review_output.txt
          
          # Salva output para próximo step (multiline)
          {
            echo 'REVIEW_CONTENT<<EOF'
            cat review_output.txt
            echo 'EOF'
          } >> $GITHUB_OUTPUT
      
      - name: Comentar no PR
        if: steps.diff.outputs.diff_size != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const review = `## 🧜‍♀️ Revisão da Iara
            
            ${{ steps.review.outputs.REVIEW_CONTENT }}
            
            ---
            *Iara é a guardiã do código do Curupira · Powered by OpenRouter (Free Models)*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: review
            });
      
      - name: Sem alterações
        if: steps.diff.outputs.diff_size == '0'
        run: echo "✅ Nenhuma alteração de código detectada."
