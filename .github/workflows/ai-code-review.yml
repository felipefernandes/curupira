# Iara Code Reviewer - Curupira Edition
# Revisão automatizada de PRs alinhada ao Manifesto Curupira
#
# Versão: v1.9.0 (GitHub Action Oficial)
# Features:
#   - Inline PR comments (comentários nas linhas específicas)
#   - False positive reduction (80-90% menos falsos positivos)
#   - Multi-provider support (OpenRouter, Groq, Anthropic, OpenAI, Gemini)
#   - Context-aware filtering
#
# Setup:
#   1. Adicione OPENROUTER_API_KEY como secret do repositório
#      (Settings > Secrets and variables > Actions > New repository secret)
#   2. Crie um arquivo .iara.json na raiz do projeto (veja exemplo abaixo)
#   3. Copie este arquivo para .github/workflows/iara-review.yml

name: "🧜‍♀️ Iara - Revisora de Código"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: "Executar revisão"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para análise completa do histórico

      - name: Run Iara Code Review
        uses: felipefernandes/iara@v1.9.0
        with:
          # API Key do Groq
          groq_api_key: ${{ secrets.GROQ_API_KEY }}
          provider: 'groq'
          model: 'llama-3.3-70b-versatile'

          # Modo de review: 'inline' ou 'summary'
          # inline = comentários nas linhas específicas (recomendado!)
          # summary = comentário único com todas as issues
          review_mode: 'inline'

          # Idioma da review (pt-br para Curupira)
          language: 'pt-br'

          # Caminho do arquivo de configuração (opcional)
          # Se não especificado, usa .iara.json na raiz
          config_path: '.iara.json'
          
          # GitHub variables explícitas para a nova versão da Action Docker
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repository: ${{ github.repository }}
          github_event_path: ${{ github.event_path }}